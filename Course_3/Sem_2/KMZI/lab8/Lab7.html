<!DOCTYPE html>
<html>

<head>
    <title>Лаб7</title>
</head>

<body>
    <h1>Лаб7</h1>
    <div id="output"></div>

    <script>
        function printMatrix(matrix) {
            let output = '';
            matrix.forEach(row => {
                output += row + '<br>';
            });
            output += '<br>';
            document.getElementById('output').innerHTML += output;
        }

        function sortedMatrix(matrix) {
            return matrix.slice().sort();
        }

        function createMatrix(input) {
            const matrix = [];
            for (let i = 0; i < input.length; i++) {
                matrix.push(input);
                input = input.substring(1) + input[0];
            }
            return matrix;
        }

        function getTheLastColumnFromMatrix(matrix) {
            let theLastColumn = "";
            matrix.forEach(row => {
                theLastColumn += row[row.length - 1];
            });
            return theLastColumn;
        }

        function getRowNumberFromMatrix(input, matrix) {
            for (let i = 0; i < matrix.length; i++) {
                if (matrix[i] === input) {
                    return i;
                }
            }
            return -1;
        }

        function addDecodingMatrixRows(input, matrix) {
            for (let i = 0; i < matrix.length; i++) {
                matrix[i] = input[i] + matrix[i];
            }
            return matrix;
        }

        function getDecodingMatrix(message) {
            const messageMatrix = new Array(message.length).fill("");

            for (let i = 0; i < message.length; i++) {
                addDecodingMatrixRows(message, messageMatrix);
                printMatrix(messageMatrix);
                messageMatrix.sort();
            }
            return messageMatrix;
        }


        const main = () => {
            const input3Letters = "мал";
            const output3Letters = Array.from(input3Letters)
                .map(char => char.charCodeAt(0).toString(2))
                .join("");

            document.getElementById('output').innerHTML += "Строка в ASCII: " + output3Letters + "<br><br>";

            const input = [
                "ободов",
                "павел",
                "малосимпотичный",
                output3Letters
            ];

            input.forEach(words => {
                document.getElementById('output').innerHTML += "\t\t\tСообщение: " + words + "<br><br>Кодирование<br><br>";

                const startEncoding = performance.now(); // Начало измерения времени кодирования

                const w1 = createMatrix(words);
                document.getElementById('output').innerHTML += "Матрица W1 - сдвиг строк<br>";
                printMatrix(w1);
                const w2 = sortedMatrix(w1);
                document.getElementById('output').innerHTML += "Матрица W2 - отсортированные строки<br>";
                printMatrix(w2);

                const inputEncode =
                    getTheLastColumnFromMatrix(w2) + getRowNumberFromMatrix(words, w2);
                const gettedMessage = inputEncode.slice(0, words.length);

                document.getElementById('output').innerHTML += "Закодированное сообщение: " + gettedMessage + "<br>";
                document.getElementById('output').innerHTML += "Номер строки содержащей корректное сообщение: " +
                    getRowNumberFromMatrix(words, w2) +
                    "<br><br>";

                const endEncoding = performance.now(); // Конец измерения времени кодирования
                const encodingTime = endEncoding - startEncoding;

                document.getElementById('output').innerHTML += "Декодирование<br><br>";
                const startDecoding = performance.now(); // Начало измерения времени декодирования

                const w2ForDecode = getDecodingMatrix(gettedMessage);
                document.getElementById('output').innerHTML += "Восстановленная матрица W2 - отсортировали<br>";
                printMatrix(w2ForDecode);

                const numberOfInitialMessage = parseInt(
                    inputEncode.slice(words.length),
                    10
                );
                document.getElementById('output').innerHTML += "Декодированное сообщение: " + w2ForDecode[numberOfInitialMessage] + "<br>";

                const endDecoding = performance.now(); // Конец измерения времени декодирования
                const decodingTime = endDecoding - startDecoding;

                const output = w2ForDecode[numberOfInitialMessage];

                if (output === words) {
                    document.getElementById('output').innerHTML += "Успешно!<br>";
                } else {
                    document.getElementById('output').innerHTML += "Ничего не получилось...<br>";
                }

                document.getElementById('output').innerHTML += "<br>Время кодирования: " + encodingTime.toFixed(4) + " мс<br>";
                document.getElementById('output').innerHTML += "Время декодирования: " + decodingTime.toFixed(4) + " мс<br><br>";
            });
        }

        main();
    </script>
</body>

</html>
