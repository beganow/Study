<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>XmlHttpRequest</title>
</head>

<body>
    <h1>Student Info:</h1>
    <span id="name"></span>
</body>

<script>
    function getName() {
        fetch('http://localhost:5000/api/name')
            .then(response => response.text())
            .then(data => {
                document.querySelector('#name').innerHTML = data;
            })
            .catch(error => {
                console.log('Произошла ошибка:', error);
            });
    }

    document.addEventListener("DOMContentLoaded", function () {
        getName();
    });
</script>

</html>
