<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sender</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: left;
        }

        h1 {
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px;
            background-color: purple;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: red;
            color: black;
        }
    </style>
</head>

<body>
    <form action="/send" method="post">
        <label for="sender">Отправитель:</label>
        <input type="email" name="sender" id="sender" required><br>

        <label for="receiver">Получатель:</label>
        <input type="email" name="receiver" id="receiver" required><br>

        <label for="message">Сообщение:</label><br>
        <textarea name="message" id="message" rows="4" required></textarea><br>

        <button type="submit">Отправить</button>
    </form>
</body>

</html>
